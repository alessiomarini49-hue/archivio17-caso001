<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivio 17 — Caso 001 · Atto 3 · La Chiusura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/case-app.css">
</head>
<body>

<div id="case-app-root"></div>

<script src="assets/config.js"></script>
<script src="assets/case-app.js"></script>
<script src="assets/case-engine.js"></script>
<script>
(function(){
  // ============================================================
  // ATTO 3 — validators custom + section plugins (casella3, verifiche)
  // ============================================================

  // --- Validator T3A: 3 campi, F1=subject-groups, F2/F3=hasAny -----------
  function validatorT3A(ctx){
    const { term, raws, helpers, data } = ctx;
    const D = data.dictionaries || {};
    const fields = term.validator.fields;
    const texts = raws.map(v => helpers.prep(v));
    let errors = 0, allOk = true;

    // Campo 1 — sovrapposizioni: serve >= N gruppi-sospetto matched
    const groups = D.t3aSubjectGroups || [];
    const minG = D.t3aSubjectGroupsMin || 2;
    const matchCount = groups.filter(g => g.some(k => texts[0].includes(helpers.prep(k)))).length;
    const fb1 = fields[0].feedback;
    if(matchCount >= minG){
      helpers.setFieldState(term.id, 1, 'ok', fb1.ok);
    } else if(matchCount === 1 || helpers.isAmbiguousGeneric(raws[0], D.ambiguousGeneric)){
      helpers.setFieldState(term.id, 1, 'ambiguous', fb1.ambiguous);
      allOk = false;
    } else {
      helpers.setFieldState(term.id, 1, 'error', fb1.error);
      errors++; allOk = false;
    }

    // Campo 2 — coinvolgimento multiplo
    const fb2 = fields[1].feedback;
    if(helpers.hasAny(texts[1], D.t3aKwElement || [])){
      helpers.setFieldState(term.id, 2, 'ok', fb2.ok);
    } else if(helpers.isAmbiguousGeneric(raws[1], D.ambiguousGeneric)){
      helpers.setFieldState(term.id, 2, 'ambiguous', fb2.ambiguous);
      allOk = false;
    } else {
      helpers.setFieldState(term.id, 2, 'error', fb2.error);
      errors++; allOk = false;
    }

    // Campo 3 — elementi non verificati
    const fb3 = fields[2].feedback;
    if(helpers.hasAny(texts[2], D.t3aKwOpen || [])){
      helpers.setFieldState(term.id, 3, 'ok', fb3.ok);
    } else if(helpers.isAmbiguousGeneric(raws[2], D.ambiguousGeneric)){
      helpers.setFieldState(term.id, 3, 'ambiguous', fb3.ambiguous);
      allOk = false;
    } else {
      helpers.setFieldState(term.id, 3, 'error', fb3.error);
      errors++; allOk = false;
    }

    return { allOk: allOk, errors: errors };
  }

  // --- Validator T3B: 6 campi, accesso + 4 linee suspect + convergenza --
  function validatorT3B(ctx){
    const { term, raws, helpers, data } = ctx;
    const D = data.dictionaries || {};
    const fields = term.validator.fields;
    const texts = raws.map(v => helpers.prep(v));
    let errors = 0, allOk = true;

    const setField = (idx, st, msg) => helpers.setFieldState(term.id, fields[idx].id, st, msg);

    // Campo 1 — accesso secondario
    const fb1 = fields[0].feedback;
    if(helpers.hasAny(texts[0], D.t3bKwAccess || [])){
      setField(0, 'ok', fb1.ok);
    } else if(texts[0].includes('principale')){
      setField(0, 'error', fb1.errorMain || fb1.error);
      errors++; allOk = false;
    } else if(helpers.isAmbiguousGeneric(raws[0], D.ambiguousGeneric) || texts[0].includes('ingresso') || texts[0].includes('accesso')){
      setField(0, 'ambiguous', fb1.ambiguous);
      allOk = false;
    } else {
      setField(0, 'error', fb1.error);
      errors++; allOk = false;
    }

    // Helper per linee suspect (Elena, Davide, Manfredi) — specific OR weak
    function evalLine(idx, specKey, weakKey){
      const t = texts[idx];
      const raw = raws[idx];
      const fb = fields[idx].feedback;
      if(helpers.hasAny(t, D[specKey] || [])){
        setField(idx, 'ok', fb.ok);
      } else if(helpers.hasAny(t, D[weakKey] || [])){
        setField(idx, 'ok', fb.okWeak || fb.ok);
      } else if(helpers.isAmbiguousGeneric(raw, D.ambiguousGeneric)){
        setField(idx, 'ambiguous', fb.ambiguous);
        allOk = false;
      } else {
        setField(idx, 'error', fb.error);
        errors++; allOk = false;
      }
    }

    // Campo 2 — Elena
    evalLine(1, 't3bKwElenaSpec', 't3bKwElenaWeak');

    // Campo 3 — Davide
    evalLine(2, 't3bKwDavideSpec', 't3bKwDavideWeak');

    // Campo 4 — Stefano (strict, no weak fallback)
    const fbS = fields[3].feedback;
    if(helpers.hasAny(texts[3], D.t3bKwStefano || [])){
      setField(3, 'ok', fbS.ok);
    } else if(helpers.isAmbiguousGeneric(raws[3], D.ambiguousGeneric) || texts[3].includes('soldi') || texts[3].includes('denaro')){
      setField(3, 'ambiguous', fbS.ambiguous);
      allOk = false;
    } else {
      setField(3, 'error', fbS.error);
      errors++; allOk = false;
    }

    // Campo 5 — Manfredi (con varianti minaccioso/pericoloso → ambiguous)
    const fbM = fields[4].feedback;
    if(helpers.hasAny(texts[4], D.t3bKwManfrediSpec || [])){
      setField(4, 'ok', fbM.ok);
    } else if(helpers.hasAny(texts[4], D.t3bKwManfrediWeak || [])){
      setField(4, 'ok', fbM.okWeak || fbM.ok);
    } else if(helpers.isAmbiguousGeneric(raws[4], D.ambiguousGeneric) || texts[4].includes('minaccioso') || texts[4].includes('pericoloso')){
      setField(4, 'ambiguous', fbM.ambiguous);
      allOk = false;
    } else {
      setField(4, 'error', fbM.error);
      errors++; allOk = false;
    }

    // Campo 6 — convergenza Stefano
    const fbC = fields[5].feedback;
    if(helpers.hasAny(texts[5], D.t3bKwConvergenza || [])){
      setField(5, 'ok', fbC.ok);
    } else if(helpers.isAmbiguousGeneric(raws[5], D.ambiguousGeneric)){
      setField(5, 'ambiguous', fbC.ambiguous);
      allOk = false;
    } else {
      setField(5, 'error', fbC.error);
      errors++; allOk = false;
    }

    return { allOk: allOk, errors: errors };
  }

  // --- Section plugin: casella3 (password + emails + blocked) -----------
  const casella3Plugin = {
    render: function(ctx){
      const c = ctx.data.casella3;
      const pluginState = ctx.state.plugins.casella3 || {};
      const remaining = (pluginState.attempts != null) ? pluginState.attempts : c.maxAttempts;
      const emailsHtml = c.emails.map(function(e){
        return '<div class="email-card" data-casella-email="' + e.id + '">' +
          '<div class="email-card-id">' + e.id + '</div>' +
          '<div class="email-card-obj">' + e.obj + '</div>' +
          '<div class="email-card-cat">' + e.cat + '</div>' +
          '<div class="email-card-consulted" data-casella-consulted="' + e.id + '" style="display:none">✓ Consultato</div>' +
        '</div>';
      }).join('');
      return ''+
      '<div class="section-header">'+
      '  <div class="section-eyebrow">' + c.eyebrow + '</div>'+
      '  <h2 class="section-title">' + c.title + '</h2>'+
      '  <div class="section-subtitle">' + c.subtitle + '</div>'+
      '  <p class="section-desc">' + c.desc + '</p>'+
      '</div>'+
      // Panel password
      '<div class="casella-panel" id="casella3-panel">'+
      '  <div class="casella-eyebrow">' + c.panelEyebrow + '</div>'+
      '  <div class="casella-title">' + c.panelTitle + '</div>'+
      '  <div class="casella-format-info">'+
      '    ' + c.formatLabel + '<br>'+
      '    ' + c.attemptsLabel + ': <span id="casella3-attempts-label">' + remaining + '</span><br>'+
      '    ' + c.supportLabel +
      '  </div>'+
      '  <div class="casella-input-row">'+
      '    <input type="text" class="casella-input" id="casella3-input" maxlength="10" placeholder="' + c.inputPlaceholder + '" inputmode="numeric" autocomplete="off">'+
      '    <button class="btn-primary" id="casella3-submit">' + c.submitLabel + '</button>'+
      '  </div>'+
      '  <div class="casella-msg" id="casella3-msg"></div>'+
      '  <div class="casella-hint">' + c.hint + '</div>'+
      '  <div class="casella-note">' + c.note + '</div>'+
      '</div>'+
      // Unlocked view (emails)
      '<div id="casella3-emails" style="display:none">'+
      '  <div class="promemoria-card" style="border-color:var(--success-border)">'+
      '    <div class="promemoria-label" style="color:var(--success-text)">' + c.unlockedHeaderLabel + '</div>'+
      '    <div class="promemoria-text"><p>' + c.unlockedHeaderText + '</p></div>'+
      '  </div>'+
      '  <div class="docs-section-label">' + c.emailsLabel + '</div>'+
      '  <div class="email-grid">' + emailsHtml + '</div>'+
      '</div>'+
      // Blocked view
      '<div id="casella3-blocked" style="display:none">'+
      '  <div class="promemoria-card" style="border-color:var(--border-red)">'+
      '    <div class="promemoria-label" style="color:var(--text-dim)">' + c.blockedHeaderLabel + '</div>'+
      '    <div class="promemoria-text"><p>' + c.blockedHeaderText + '</p></div>'+
      '  </div>'+
      '</div>';
    },

    init: function(ctx){
      const c = ctx.data.casella3;
      // Garantisce shape state.plugins.casella3
      if(!ctx.state.plugins.casella3){
        ctx.state.plugins.casella3 = { attempts: c.maxAttempts, unlocked: false, blocked: false, emailsOpened: [] };
      } else {
        if(ctx.state.plugins.casella3.attempts == null) ctx.state.plugins.casella3.attempts = c.maxAttempts;
        if(!Array.isArray(ctx.state.plugins.casella3.emailsOpened)) ctx.state.plugins.casella3.emailsOpened = [];
      }
      casella3Plugin._syncView(ctx);
      casella3Plugin._wireSubmit(ctx);
      casella3Plugin._wireEmails(ctx);
    },

    onReset: function(ctx){
      const c = ctx.data.casella3;
      ctx.state.plugins.casella3 = { attempts: c.maxAttempts, unlocked: false, blocked: false, emailsOpened: [] };
      // Re-enable input se siamo dopo un reset post-blocco/unlock
      const input = document.getElementById('casella3-input');
      const btn   = document.getElementById('casella3-submit');
      const msg   = document.getElementById('casella3-msg');
      if(input){ input.disabled = false; input.value = ''; }
      if(btn)  btn.disabled = false;
      if(msg){ msg.textContent = ''; msg.className = 'casella-msg'; }
      const lbl = document.getElementById('casella3-attempts-label');
      if(lbl) lbl.textContent = c.maxAttempts;
      casella3Plugin._syncView(ctx);
    },

    _syncView: function(ctx){
      const s = ctx.state.plugins.casella3;
      const panel   = document.getElementById('casella3-panel');
      const emails  = document.getElementById('casella3-emails');
      const blocked = document.getElementById('casella3-blocked');
      if(!panel || !emails || !blocked) return;
      if(s.unlocked){
        panel.style.display = 'none';
        emails.style.display = 'block';
        blocked.style.display = 'none';
        // Marca email già consultate
        s.emailsOpened.forEach(function(eid){
          const flag = document.querySelector('[data-casella-consulted="' + eid + '"]');
          if(flag) flag.style.display = 'block';
          const card = document.querySelector('[data-casella-email="' + eid + '"]');
          if(card) card.classList.add('consulted');
        });
      } else if(s.blocked){
        panel.style.display = 'none';
        emails.style.display = 'none';
        blocked.style.display = 'block';
      } else {
        panel.style.display = '';
        emails.style.display = 'none';
        blocked.style.display = 'none';
      }
    },

    _wireSubmit: function(ctx){
      const c = ctx.data.casella3;
      const btn   = document.getElementById('casella3-submit');
      const input = document.getElementById('casella3-input');
      const msg   = document.getElementById('casella3-msg');
      const lbl   = document.getElementById('casella3-attempts-label');
      if(!btn || !input || !msg) return;
      const s = ctx.state.plugins.casella3;

      // Stato post-load: se già unlocked/blocked, disabilita controlli
      if(s.unlocked || s.blocked){
        input.disabled = true;
        btn.disabled = true;
      }

      const tryUnlock = function(){
        if(s.unlocked || s.blocked) return;
        const raw = (input.value || '').replace(/[\s\/\-]/g, '');
        if(raw === c.password){
          s.unlocked = true;
          s.attempts = 0;
          ctx.helpers.saveState();
          msg.textContent = c.unlockMsg;
          msg.className = 'casella-msg success';
          btn.disabled = true;
          input.disabled = true;
          setTimeout(function(){
            casella3Plugin._syncView(ctx);
            ctx.helpers.updateUI();
          }, 1500);
        } else {
          s.attempts--;
          if(s.attempts <= 0){
            s.blocked = true;
            s.attempts = 0;
            ctx.helpers.saveState();
            msg.textContent = c.blockedMsg;
            msg.className = 'casella-msg blocked';
            btn.disabled = true;
            input.disabled = true;
            if(lbl) lbl.textContent = '0';
            setTimeout(function(){
              casella3Plugin._syncView(ctx);
              ctx.helpers.updateUI();
            }, 1500);
          } else {
            ctx.helpers.saveState();
            msg.textContent = c.wrongMsg.replace('{remaining}', s.attempts);
            msg.className = 'casella-msg error';
            if(lbl) lbl.textContent = s.attempts;
          }
          input.value = '';
        }
      };
      btn.addEventListener('click', tryUnlock);
      input.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); tryUnlock(); } });
    },

    _wireEmails: function(ctx){
      const c = ctx.data.casella3;
      document.querySelectorAll('[data-casella-email]').forEach(function(card){
        card.addEventListener('click', function(){
          const eid = card.getAttribute('data-casella-email');
          const e = c.emails.find(function(x){ return x.id === eid; });
          if(!e) return;
          const s = ctx.state.plugins.casella3;
          if(!s.emailsOpened.includes(eid)){
            s.emailsOpened.push(eid);
            ctx.helpers.saveState();
          }
          card.classList.add('consulted');
          const flag = document.querySelector('[data-casella-consulted="' + eid + '"]');
          if(flag) flag.style.display = 'block';

          // Riusa il viewer-overlay dell'engine (condiviso con docs)
          const setT = function(id, txt){ const el = document.getElementById(id); if(el) el.textContent = txt; };
          setT('v-code', e.id);
          setT('v-cat', e.cat);
          setT('v-title', e.obj);
          setT('v-consulted', '✓ CONSULTATO');
          document.getElementById('v-transcript').textContent = 'Da: ' + e.from + '\nA: ' + e.to + '\n\n' + e.body;
          const imgC = document.getElementById('v-img-container');
          if(e.imageUrl){
            imgC.innerHTML = '<div class="evidence-frame"><img src="' + e.imageUrl + '" alt="" loading="lazy"><div class="evidence-frame-label"><span>' + e.id + ' — ' + e.cat + '</span><span>RISERVATO</span></div></div>';
          } else {
            imgC.innerHTML = '';
          }
          const notePanel = document.getElementById('v-note-panel');
          if(notePanel) notePanel.style.display = 'none';
          document.getElementById('viewer-overlay').classList.add('open');
          document.body.classList.add('no-scroll');
          const vb = document.getElementById('viewer-body');
          if(vb) vb.scrollTop = 0;
        });
      });
    }
  };

  // --- Section plugin: verifiche (4 note statiche) ----------------------
  const verifichePlugin = {
    render: function(ctx){
      const v = ctx.data.verifiche;
      const notesHtml = (v.notes || []).map(function(n){
        return '<div class="verifica-note-card">' +
          '<div class="verifica-note-id">' + n.label + '</div>' +
          '<div class="verifica-note-title">' + n.title + '</div>' +
          '<div class="verifica-note-text">' + n.text + '</div>' +
          '<div class="verifica-note-nota">' + n.nota + '</div>' +
        '</div>';
      }).join('');
      return ''+
      '<div class="section-header">'+
      '  <div class="section-eyebrow">' + v.eyebrow + '</div>'+
      '  <h2 class="section-title">' + v.title + '</h2>'+
      '  <div class="section-subtitle">' + v.subtitle + '</div>'+
      '  <p class="section-desc">' + v.desc + '</p>'+
      '</div>'+
      '<div class="verifica-notes">' + notesHtml + '</div>'+
      '<div style="margin-top:1.5rem">'+
      '  <button class="btn-primary" data-section="' + v.ctaTarget + '">' + v.ctaLabel + '</button>'+
      '</div>';
    }
  };

  // --- Boot -------------------------------------------------------------
  createCaseApp({
    actNum: 3,
    dataUrl: 'data/atto3.json',
    storageKey: 'a17_atto3_v2',
    storageVersion: 2,
    localCodes: ['A17-ATTO3', 'A17-DEMO'],
    skin: 'rich',
    validators: {
      'atto3-t3a': validatorT3A,
      'atto3-t3b': validatorT3B
    },
    sectionPlugins: {
      casella3: casella3Plugin,
      verifiche: verifichePlugin
    }
  });
})();
</script>
</body>
</html>
